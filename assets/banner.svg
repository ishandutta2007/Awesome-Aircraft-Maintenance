<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0A0E1A"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><radialGradient id="radarSweep" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".35"/><stop offset="70%" stop-color="#38BDF8" stop-opacity=".08"/><stop offset="100%" stop-color="#0F172A" stop-opacity="0"/></radialGradient></defs><style>@keyframes jetFly{0%{transform:translate(-80px,40px) scale(.85);opacity:0}15%,85%{opacity:.85}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.8}}.radar-sweep-group{transform-origin:960px 180px;animation:radarRotate 10s linear infinite}.jet-anim{animation:jetFly 9s linear infinite}.blip-pulse{animation:pulseGlow 2.5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGradient)" stroke="#334155" stroke-width="2" rx="16"/><g stroke="#38BDF8" stroke-width=".75" opacity=".12"><path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200"/><path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360 M600 0 V360 M700 0 V360 M800 0 V360 M900 0 V360 M1000 0 V360 M1100 0 V360"/></g><g transform="translate(0, 0)"><circle cx="960" cy="180" r="140" fill="none" stroke="#38BDF8" stroke-opacity=".25" stroke-width="1.5"/><circle cx="960" cy="180" r="95" fill="none" stroke="#38BDF8" stroke-opacity=".2" stroke-width="1"/><circle cx="960" cy="180" r="50" fill="none" stroke="#38BDF8" stroke-opacity=".2" stroke-width="1"/><line x1="960" x2="960" y1="35" y2="325" stroke="#38BDF8" stroke-dasharray="4 4" stroke-opacity=".25" stroke-width="1"/><line x1